<div class="c-movement">
    <div class="c-movement__icon" [class.c-movement__icon--credit]="movement.originAccountIban == ibanOrigin"
        [class.c-movement__icon--debit]="movement.originAccountIban != ibanOrigin">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            @if (movement.originAccountIban == ibanOrigin) {
            <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            } @else {
            <path d="M19 12H5M5 12L12 5M5 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            }
        </svg>
    </div>
    <div class="c-movement__details">
        <p class="c-movement__description">{{ movement.concept }}</p>
        <p class="c-movement__date">{{ movement.date | date:'dd/MM' }}</p>
    </div>
    <p class="c-movement__amount">
        {{ movement.movementType === 'DEBIT' ? '+' : '-' }} {{ movement.amount | number:'1.2-2' }} €
    </p>
</div>
