<div class="c-panel-cards">
    <div class="c-panel-cards__header">
        <h2 class="c-panel-cards__title">Tarjetas</h2>
        <a class="c-panel-cards__link">Mostrar todas</a>
    </div>

    @if (cards.length > 0) {
        <div class="c-panel-cards__carousel" (scroll)="onScroll($event)">
            @for (card of cards; track card.cardNumber; let i = $index) {
                <div class="c-panel-cards__card-wrapper" 
                     [class.c-panel-cards__card-wrapper--active]="i === currentCardIndex">
                    <c-card [card]="card"/>
                </div>
            }
        </div>

        @if (cards.length > 1) {
            <div class="c-panel-cards__indicators">
                @for (card of cards; track card.cardNumber; let i = $index) {
                    <button 
                        class="c-panel-cards__indicator" 
                        [class.c-panel-cards__indicator--active]="i === currentCardIndex"
                        (click)="scrollToCard(i)"
                        [attr.aria-label]="'Ver tarjeta ' + (i + 1)">
                    </button>
                }
            </div>
        }
    } @else {
        <p class="c-panel-cards__empty">No tienes tarjetas activas</p>
    }
</div>
